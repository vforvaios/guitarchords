<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎈 ΜΑΖΙΚΗ ΣΧΟΛΙΚΗ ΚΛΗΡΩΣΗ ΔΩΡΩΝ 🎈</title>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
        color: #333;
        font-family: "Comic Sans MS", "Chalkboard SE", "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 30px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        border: 4px solid #ffd43b;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 5px;
        font-size: 2.8rem;
        color: #ff4757;
        text-shadow: 2px 2px 0px #ffd43b;
      }

      .subtitle {
        color: #57606f;
        font-size: 1.1rem;
        margin-bottom: 25px;
        font-weight: bold;
      }

      /* Στυλ Πίνακα Αποτελεσμάτων */
      .table-container {
        margin: 25px 0;
        overflow-x: auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        border: 2px solid #70a1ff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 1.1rem;
      }

      th,
      td {
        padding: 15px;
        border-bottom: 1px solid #e4e7eb;
      }

      th {
        background-color: #70a1ff;
        color: white;
        font-size: 1.2rem;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tr:nth-child(even) {
        background-color: #f1f2f6;
      }

      .ticket-badge {
        background: #2ed573;
        color: white;
        padding: 5px 15px;
        border-radius: 50px;
        font-weight: bold;
        display: inline-block;
      }

      /* Πάνελ Χειρισμού */
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 25px;
        background: #ffa502;
        padding: 20px;
        border-radius: 25px;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .control {
        background: white;
        padding: 10px;
        border-radius: 18px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #57606f;
        font-size: 0.9rem;
        font-weight: bold;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        border: 2px solid #ced6e0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        text-align: center;
      }

      input {
        background: #f8f9fa;
        color: #23272a;
        font-weight: bold;
      }

      input:focus {
        border-color: #ff4757;
        outline: none;
      }

      button {
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
        transition: all 0.1s ease;
      }

      #drawBtn {
        background: #2ed573;
        border-bottom: 5px solid #26af5f;
      }
      #drawBtn:active {
        transform: translateY(4px);
        border-bottom-width: 1px;
      }

      .print-btn {
        background: #1e90ff !important;
        border-bottom: 5px solid #0066cc !important;
      }
      .print-btn:active {
        transform: translateY(4px);
        border-bottom-width: 1px;
      }

      .reset-btn {
        background: #747d8c !important;
        border-bottom: 5px solid #57606f !important;
      }
      .reset-btn:active {
        transform: translateY(4px);
        border-bottom-width: 1px;
      }

      .no-winners {
        color: #a4b0be;
        padding: 20px;
        font-style: italic;
      }

      /* 🖨️ ΕΙΔΙΚΕΣ ΡΥΘΜΙΣΕΙΣ ΓΙΑ ΤΗΝ ΕΚΤΥΠΩΣΗ */
      @media print {
        body {
          background: white !important;
          color: black !important;
          padding: 0;
        }
        .container {
          box-shadow: none !important;
          border: none !important;
          background: white !important;
          max-width: 100% !important;
          padding: 0 !important;
        }
        .controls,
        .subtitle {
          display: none !important; /* Κρύβει τα κουμπιά και τις ρυθμίσεις */
        }
        .table-container {
          border: 1px solid black !important;
          box-shadow: none !important;
        }
        th {
          background-color: #f1f2f6 !important;
          color: black !important;
          border-bottom: 2px solid black !important;
        }
        .ticket-badge {
          color: black !important;
          background: transparent !important;
          padding: 0 !important;
          font-weight: bold;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎉 ΣΧΟΛΙΚΗ ΚΛΗΡΩΣΗ 🎉</h1>

      <div class="subtitle">
        🎁 Συμπληρώστε τα στοιχεία και πατήστε "ΚΛΗΡΩΣΗ" για να βγουν μαζικά οι
        νικητές!
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 15%; text-align: center">Α/Α</th>
              <th style="width: 50%">🎁 Όνομα Δώρου</th>
              <th style="width: 35%; text-align: center">🎫 Τυχερός Λαχνός</th>
            </tr>
          </thead>
          <tbody id="winnersTableBody">
            <tr>
              <td colspan="3" class="no-winners">
                Δεν έχει γίνει ακόμα κάποια κλήρωση
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="controls">
        <div class="control">
          <label>🎁 Όνομα Δώρου</label>
          <input type="text" id="giftInput" value="Δώρο" />
        </div>

        <div class="control">
          <label>🔢 Πλήθος Δώρων</label>
          <input type="number" id="giftCount" value="10" min="1" />
        </div>

        <div class="control">
          <label>🎫 Από Λαχνό</label>
          <input type="number" id="startTicket" value="1" min="1" />
        </div>

        <div class="control">
          <label>🎫 Έως Λαχνό</label>
          <input type="number" id="endTicket" value="100" min="1" />
        </div>

        <div class="control">
          <label>🚀 Μαζική</label>
          <button id="drawBtn">🎰 ΚΛΗΡΩΣΗ</button>
        </div>

        <div class="control">
          <label>🖨️ Χαρτί</label>
          <button id="printBtn" class="print-btn">🖨️ ΕΚΤΥΠΩΣΗ</button>
        </div>

        <div class="control">
          <label>🔄 Καθαρισμός</label>
          <button id="resetBtn" class="reset-btn">🔄 RESET</button>
        </div>
      </div>
    </div>

    <script>
      const winnersTableBody = document.getElementById("winnersTableBody");
      const giftInput = document.getElementById("giftInput");
      const giftCountInput = document.getElementById("giftCount");
      const startTicketInput = document.getElementById("startTicket");
      const endTicketInput = document.getElementById("endTicket");

      const drawBtn = document.getElementById("drawBtn");
      const printBtn = document.getElementById("printBtn");
      const resetBtn = document.getElementById("resetBtn");

      let winningHistory = [];

      function drawAllWinners() {
        const baseGiftName = giftInput.value.trim() || "Δώρο";
        const countToDraw = parseInt(giftCountInput.value);
        const start = parseInt(startTicketInput.value);
        const end = parseInt(endTicketInput.value);

        if (isNaN(start) || isNaN(end) || start > end) {
          alert("Ωχ! Παρακαλώ βάλε σωστά τα νούμερα των λαχνών (Από <= Έως).");
          return;
        }

        if (isNaN(countToDraw) || countToDraw <= 0) {
          alert("Παρακαλώ δώσε έναν έγκυρο αριθμό για το πλήθος των δώρων.");
          return;
        }

        // 1. Δημιουργία λίστας με τους διαθέσιμους λαχνούς
        let availableTickets = [];
        for (let i = start; i <= end; i++) {
          availableTickets.push(i);
        }

        // 2. Έλεγχος αν οι λαχνοί φτάνουν για τα δώρα
        if (countToDraw > availableTickets.length) {
          alert(
            `Προσοχή! Ζητήσατε ${countToDraw} δώρα, αλλά οι διαθέσιμοι λαχνοί στο εύρος αυτό είναι μόνο ${availableTickets.length}.`,
          );
          return;
        }

        // Καθαρισμός παλιού ιστορικού για τη νέα μαζική κλήρωση
        winningHistory = [];

        // 3. Αλγόριθμος τυχαίας επιλογής χωρίς επαναλήψεις
        let currentGiftNumber = 1;
        for (let k = 0; k < countToDraw; k++) {
          const randomIndex = Math.floor(
            Math.random() * availableTickets.length,
          );
          const luckyTicket = availableTickets.splice(randomIndex, 1)[0]; // Αφαιρεί τον λαχνό για να μην ξανακληρωθεί

          winningHistory.push({
            index: currentGiftNumber,
            gift: `${baseGiftName} ${currentGiftNumber}`,
            ticket: luckyTicket,
          });
          currentGiftNumber++;
        }

        // 4. Εμφάνιση αποτελεσμάτων στον πίνακα
        renderTable();

        // 🎉 Εφέ κομφετί για πανηγυρισμό!
        confetti({
          particleCount: 180,
          spread: 100,
          origin: { y: 0.6 },
        });
      }

      function renderTable() {
        if (winningHistory.length === 0) {
          winnersTableBody.innerHTML = `
            <tr>
              <td colspan="3" class="no-winners">Δεν έχει γίνει ακόμα κάποια κλήρωση</td>
            </tr>`;
          return;
        }

        winnersTableBody.innerHTML = "";
        winningHistory.forEach((item) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="text-align: center; font-weight: bold;">${item.index}</td>
            <td>🎁 ${item.gift}</td>
            <td style="text-align: center;"><span class="ticket-badge">${item.ticket}</span></td>
          `;
          winnersTableBody.appendChild(tr);
        });
      }

      function resetRaffle() {
        if (confirm("Θέλεις σίγουρα να σβήσεις τα αποτελέσματα;")) {
          winningHistory = [];
          renderTable();
          giftInput.value = "Δώρο";
          giftCountInput.value = "10";
        }
      }

      // Σύνδεση Κουμπιών με Λειτουργίες
      drawBtn.addEventListener("click", drawAllWinners);
      resetBtn.addEventListener("click", resetRaffle);
      printBtn.addEventListener("click", () => {
        if (winningHistory.length === 0) {
          alert("Δεν υπάρχει λίστα νικητών για να τυπωθεί!");
          return;
        }
        window.print(); // Ανοίγει το παράθυρο εκτύπωσης του browser
      });
    </script>
  </body>
</html>
