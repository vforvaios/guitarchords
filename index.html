<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Queue Trainer</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f7cff" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0f1115;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
        font-size: 2.5rem;
      }

      .subtitle {
        color: #999;
        margin-bottom: 30px;
      }

      /* 🎬 ΚΑΘΕΤΟ ΚΥΛΙΟΜΕΝΟ ΠΑΡΑΘΥΡΟ (VIEWPORT) + METRONOME BORDER */
      .queue-container {
        height: 280px;
        overflow: hidden;
        position: relative;
        margin: 30px auto;
        max-width: 300px;
        border-radius: 20px;
        background: rgba(29, 35, 48, 0.2);
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        border: 3px solid #1d2330;
        transition: border-color 0.1s ease, box-shadow 0.1s ease;
      }

      /* Κλάσεις για το οπτικό φλας του μετρονόμου */
      .queue-container.metro-accent {
        border-color: #4f7cff;
        box-shadow: 0 0 25px rgba(79, 124, 255, 0.6), inset 0 0 20px rgba(79, 124, 255, 0.2);
      }

      .queue-container.metro-normal {
        border-color: #3a5cb3;
        box-shadow: 0 0 15px rgba(58, 92, 179, 0.4), inset 0 0 20px rgba(58, 92, 179, 0.1);
      }

      .queue {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      }

      .queueChord {
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        font-size: 2rem;
        transition: all 0.3s ease;
        opacity: 0.2;
        user-select: none;
        transform: scale(0.75);
      }

      .queueChord.active {
        color: #4f7cff;
        opacity: 1;
        transform: scale(1.4);
        font-weight: bold;
        text-shadow: 0 0 15px rgba(79, 124, 255, 0.4);
      }

      .queueChord.next {
        opacity: 0.6;
        transform: scale(1);
        color: #ffffff;
      }

      /* 🚥 ΟΠΤΙΚΟΙ ΚΥΚΛΟΙ ΜΕΤΡΟΝΟΜΟΥ (BEAT DOTS) */
      .metro-dots {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
      }

      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50px;
        background: #1d2330;
        transition: all 0.1s ease;
      }

      .dot.active-accent {
        background: #4f7cff;
        transform: scale(1.3);
        box-shadow: 0 0 15px #4f7cff;
      }

      .dot.active-normal {
        background: #a2b9ff;
        transform: scale(1.15);
        box-shadow: 0 0 10px #a2b9ff;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin-top: 30px;
      }

      .control {
        background: #1b1f27;
        padding: 15px;
        border-radius: 14px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #bbb;
        font-size: 0.95rem;
      }

      input,
      button,
      select {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
      }

      input,
      select {
        background: #2a2f3a;
        color: white;
      }

      button {
        background: #4f7cff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .beat {
        margin-top: 15px;
        font-size: 1.5rem;
        color: #4f7cff;
        font-weight: bold;
      }

      .status {
        margin-top: 20px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Chord Queue Trainer</h1>

      <div class="subtitle">
        Random chord practice with BPM clock & live queue
      </div>

      <div class="queue-container" id="viewport">
        <div id="queue" class="queue"></div>
      </div>

      <div id="metroDots" class="metro-dots"></div>

      <div id="beatDisplay" class="beat">Beat 1</div>

      <div class="controls">
        <div class="control">
          <label>BPM</label>
          <input type="number" id="bpm" value="80" min="30" max="240" />
        </div>

        <div class="control">
          <label>Beats per Chord</label>
          <input type="number" id="beatsPerChord" value="4" min="1" max="16" />
        </div>

        <div class="control">
          <label>Visible Queue Length</label>
          <input type="number" id="queueLength" value="8" min="2" max="20" />
        </div>

        <div class="control" style="display: none;">
          <label>Display Mode</label>
          <select id="displayMode">
            <option value="queue">Queue</option>
            <option value="single">Single Chord</option>
          </select>
        </div>

        <div class="control">
          <label>Chord List</label>
          <input type="text" id="chordsInput" value="C,D,Em,E,A,Am,G,F,Dm" />
        </div>

        <div class="control">
          <label>Start / Stop</label>
          <button id="toggleBtn">START</button>
        </div>

        <div class="control">
          <label>Shuffle Queue</label>
          <button id="shuffleBtn">SHUFFLE</button>
        </div>
      </div>

      <div class="status">SPACE = Start / Stop</div>
    </div>

    <script>
      const viewport = document.getElementById("viewport");
      const queueEl = document.getElementById("queue");
      const beatDisplay = document.getElementById("beatDisplay");
      const metroDotsEl = document.getElementById("metroDots");

      const bpmInput = document.getElementById("bpm");
      const beatsPerChordInput = document.getElementById("beatsPerChord");
      const chordsInput = document.getElementById("chordsInput");
      const queueLengthInput = document.getElementById("queueLength");

      const toggleBtn = document.getElementById("toggleBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const displayMode = document.getElementById("displayMode");

      let interval = null;
      let running = false;

      let beat = 0;
      let queue = [];
      let currentIndex = 0;

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playClick(accent = false) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "square";
        osc.frequency.value = accent ? 2200 : 1400;
        gain.gain.setValueAtTime(accent ? 0.45 : 0.28, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + 0.035,
        );
        osc.stop(audioCtx.currentTime + 0.035);
      }

      function getChordPool() {
        return chordsInput.value
          .split(",")
          .map((c) => c.trim())
          .filter(Boolean);
      }

      function generateQueue() {
        const pool = getChordPool();
        const length = parseInt(queueLengthInput.value);

        queue = [];
        let previous = null;

        for (let i = 0; i < length; i++) {
          let next;
          do {
            next = pool[Math.floor(Math.random() * pool.length)];
          } while (next === previous && pool.length > 1);

          queue.push(next);
          previous = next;
        }

        currentIndex = 0;
        renderQueue();
      }

      function renderQueue() {
        queueEl.innerHTML = "";

        const spacer = document.createElement("div");
        spacer.style.height = "100px";
        queueEl.appendChild(spacer);

        queue.forEach((chord, index) => {
          const div = document.createElement("div");
          div.className = "queueChord";

          if (index === currentIndex) {
            div.classList.add("active");
          } else if (index === currentIndex + 1) {
            div.classList.add("next");
          }

          div.textContent = chord;
          queueEl.appendChild(div);
        });

        queueEl.style.transform = `translateY(-${currentIndex * 80}px)`;
      }

      // Δημιουργεί δυναμικά τις κουκκίδες ανάλογα με το "Beats per Chord"
      function setupMetroDots() {
        metroDotsEl.innerHTML = "";
        const totalDots = parseInt(beatsPerChordInput.value);
        for (let i = 0; i < totalDots; i++) {
          const dot = document.createElement("div");
          dot.className = "dot";
          metroDotsEl.appendChild(dot);
        }
      }

      function triggerVisualFlash(beatInBar) {
        // 1. Flash στο κεντρικό πλαίσιο
        viewport.classList.remove("metro-accent", "metro-normal");
        // Μικρό timeout για να αναγκάσουμε τον browser να ξανατρέξει το εφέ
        void viewport.offsetWidth; 
        
        if (beatInBar === 1) {
          viewport.classList.add("metro-accent");
        } else {
          viewport.classList.add("metro-normal");
        }

        // 2. Ενημέρωση στις κουκκίδες (dots)
        const dots = metroDotsEl.children;
        for (let i = 0; i < dots.length; i++) {
          dots[i].classList.remove("active-accent", "active-normal");
          if (i === beatInBar - 1) {
            if (beatInBar === 1) {
              dots[i].classList.add("active-accent");
            } else {
              dots[i].classList.add("active-normal");
            }
          }
        }
      }

      function advanceChord() {
        currentIndex++;
        if (currentIndex >= queue.length) {
          generateQueue();
        } else {
          renderQueue();
        }
      }

      function startTrainer() {
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        clearInterval(interval);
        generateQueue();
        setupMetroDots();

        const bpm = parseInt(bpmInput.value);
        const beatsPerChord = parseInt(beatsPerChordInput.value);
        const intervalMs = (60 / bpm) * 1000;

        beat = 0;
        beatDisplay.textContent = "Beat 1";

        interval = setInterval(() => {
          beat++;
          const beatInBar = ((beat - 1) % beatsPerChord) + 1;
          beatDisplay.textContent = `Beat ${beatInBar}`;
          
          // Ήχος + Φλας
          playClick(beatInBar === 1);
          triggerVisualFlash(beatInBar);

          if (beatInBar === 1 && beat > 1) {
            advanceChord();
          }
        }, intervalMs);

        running = true;
        toggleBtn.textContent = "STOP";
      }

      function stopTrainer() {
        clearInterval(interval);
        running = false;
        toggleBtn.textContent = "START";
        
        // Καθαρισμός των visual εφέ όταν σταματάει
        viewport.classList.remove("metro-accent", "metro-normal");
        const dots = metroDotsEl.children;
        for (let i = 0; i < dots.length; i++) {
          dots[i].classList.remove("active-accent", "active-normal");
        }
      }

      toggleBtn.addEventListener("click", () => {
        if (!running) {
          startTrainer();
        } else {
          stopTrainer();
        }
      });

      shuffleBtn.addEventListener("click", () => {
        generateQueue();
        beat = 0;
        beatDisplay.textContent = "Beat 1";
        if(running) setupMetroDots();
      });

      beatsPerChordInput.addEventListener("change", () => {
        setupMetroDots();
      });

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!running) {
            startTrainer();
          } else {
            stopTrainer();
          }
        }
      });

      generateQueue();
      setupMetroDots();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => console.log("Service Worker Registered"));
      }
    </script>
  </body>
</html>
